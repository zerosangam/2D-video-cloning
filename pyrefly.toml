site-package-path = [
    "C:\\Users\\SANGAM KUMAR\\AppData\\Local\\Python\\pythoncore-3.15-64\\Lib\\site-packages"
]

search-path = [
    "D:\\Blender",
    "D:\\Blender\\engine",
    "D:\\Blender\\master_system",
    "D:\\Blender\\cache\\legacy_scripts",
    "C:\\Users\\SANGAM KUMAR\\AppData\\Local\\Python\\pythoncore-3.15-64\\Lib\\site-packages"
